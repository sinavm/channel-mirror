name: Mirror channels
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 mirror.py
      - name: Commit and push as repository owner
        env:
          GIT_AUTHOR_NAME: sinavm
          GIT_AUTHOR_EMAIL: 163084137+sinavm@users.noreply.github.com
          GIT_COMMITTER_NAME: sinavm
          GIT_COMMITTER_EMAIL: 163084137+sinavm@users.noreply.github.com
        run: |
          git config user.name "sinavm"
          git config user.email "163084137+sinavm@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No mirror changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh channel mirrors"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
